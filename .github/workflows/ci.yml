name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # All tests: per-rule fixtures, patch round-trip, determinism, false-positive corpus.
      - run: npm test
      # The doctor checks our own Flagsmith code and fails on any certain issue.
      - run: npm run doctor:self
      - run: npm run build
